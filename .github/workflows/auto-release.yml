name: Automatic release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful push CI run on main to release or recover
        type: string
        required: true

permissions: {}

env:
  LEFTHOOK: '0'
  RELEASE_SOURCE_RUN_ID:
    ${{ github.event.workflow_run.id || inputs.source_run_id }}

concurrency:
  group: >-
    automatic-release-${{
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  # Único job que instala dependências e importa o Vite+, sem permissão de
  # escrita. Entrega os arquivos formatados como artifact aos jobs seguintes.
  plan:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          cache-save: false

      - name: Plan and format release files
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN_FILE: ${{ runner.temp }}/release-plan.json
        run: bun tooling/release/plan-release.ts

      - name: Upload release plan
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
          retention-days: 1

  # Os jobs com escrita não instalam nem importam pacotes: o script usa só Git,
  # gh e módulos nativos e confere o artifact contra o plano recalculado.
  prepare:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      head: ${{ steps.release.outputs.head }}
    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-project
        with:
          install-dependencies: false
          cache-save: false

      - name: Download release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
          digest-mismatch: error

      - name: Prepare release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: prepare
          RELEASE_PLAN_FILE: ${{ runner.temp }}/release-plan/release-plan.json
        run: bun --no-install tooling/release/automatic-release.ts

  # O merge exige contents: write; ler o PR basta para conferir sua identidade.
  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-project
        with:
          install-dependencies: false
          cache-save: false

      - name: Download release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
          digest-mismatch: error

      - name: Validate release metadata, merge and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: publish
          RELEASE_HEAD: ${{ needs.prepare.outputs.head }}
          RELEASE_PLAN_FILE: ${{ runner.temp }}/release-plan/release-plan.json
        run: bun --no-install tooling/release/automatic-release.ts
