name: Automatic release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful push CI run on main to release or recover
        type: string
        required: true

permissions: {}

env:
  LEFTHOOK: '0'

concurrency:
  group: >-
    automatic-release-${{
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      head: ${{ steps.release.outputs.head }}
    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        run: |
          vite_plus_version=$(jq -er '.devDependencies["vite-plus"]' package.json)
          node_version=$(jq -er '.devEngines.runtime.version' package.json)
          echo "vite-plus=$vite_plus_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: ${{ steps.toolchain.outputs.vite-plus }}
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Prepare release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: prepare
          RELEASE_SOURCE_RUN_ID:
            ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: node tooling/release/automatic-release.ts

  validate:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.head }}

  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        run: |
          vite_plus_version=$(jq -er '.devDependencies["vite-plus"]' package.json)
          node_version=$(jq -er '.devEngines.runtime.version' package.json)
          echo "vite-plus=$vite_plus_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: ${{ steps.toolchain.outputs.vite-plus }}
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Merge release and publish tag and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: publish
          RELEASE_HEAD: ${{ needs.prepare.outputs.head }}
          RELEASE_SOURCE_RUN_ID:
            ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: node tooling/release/automatic-release.ts
