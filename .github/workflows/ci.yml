name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: '0'
  VERCEL_CLI_VERSION: '62.2.0'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up project
        id: toolchain
        uses: ./.github/actions/setup-project

      - name: Restore validation cache
        id: validation-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite/task-cache
            node_modules/.vitest-cache
            .tsbuild
          key:
            ci-validation-v2-${{ runner.os }}-${{ runner.arch }}-node-${{
            steps.toolchain.outputs.node }}-bun-${{ steps.toolchain.outputs.bun
            }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-keys: |
            ci-validation-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node }}-bun-${{ steps.toolchain.outputs.bun }}-${{ hashFiles('bun.lock') }}-

      # Cria .tsbuild antes do lint também quando o cache está vazio, para
      # estabilizar a listagem da raiz que o Vite Task rastreia.
      - name: Check Node tooling types
        run: vp run typecheck:node

      - name: Check formatting and lint
        run: vp run check:ci

      - name: Detect release tooling changes
        id: release-tests
        env:
          RELEASE_TEST_BASE:
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun tooling/release/check-changes.ts

      - name: Test release automation on Bun
        if: steps.release-tests.outputs.should_run == 'true'
        run: vp run test:release

      - name: Run tests with coverage
        run: vp run test:ci

      - name: Save validation cache
        if:
          ${{ !cancelled() && steps.validation-cache.outputs.cache-primary-key
          != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite/task-cache
            node_modules/.vitest-cache
            .tsbuild
          key: ${{ steps.validation-cache.outputs.cache-primary-key }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-quality-${{ github.run_attempt }}
          path: .vitest/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run tooling tests
        run: vp run test:tooling

  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fixtures
            script: test:e2e
          - suite: production
            script: test:e2e:production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Build deployment artifact
        id: deployment-build
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.suite == 'production'
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENABLE_EXPERIMENTAL_COREPACK: '0'
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID variable'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID variable'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret'; exit 1; }
          vp dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production
          vp dlx "vercel@$VERCEL_CLI_VERSION" build --prod --yes
          vp exec node --input-type=module <<'NODE_ARTIFACT'
          import { lstatSync, readdirSync, readFileSync, realpathSync } from 'node:fs';
          import { basename, join, sep } from 'node:path';
          const root = realpathSync('.vercel/output');
          for (const entry of readdirSync(root, { recursive: true })) {
            const file = join(root, entry);
            if (lstatSync(file).isSymbolicLink() && !realpathSync(file).startsWith(`${root}${sep}`)) {
              throw new Error('Deployment output contains an external symbolic link');
            }
            if (basename(file) === '.vc-config.json') {
              const config = JSON.parse(readFileSync(file, 'utf8'));
              if (Object.keys(config.filePathMap ?? {}).length > 0) {
                throw new Error('Deployment output must bundle files instead of using filePathMap');
              }
            }
          }
          NODE_ARTIFACT
          tar -cf "$RUNNER_TEMP/vercel-output.tar" .vercel/output
          find .vercel/output -printf '%y %m %P %l\n' | LC_ALL=C sort > "$RUNNER_TEMP/vercel-output-files.txt"

      - name: Run end-to-end tests
        if: steps.deployment-build.outcome != 'success'
        run: vp run ${{ matrix.script }}

      - name: Test deployment artifact without rebuilding
        if: steps.deployment-build.outcome == 'success'
        env:
          TEST_PRODUCTION_ROUTES: 'true'
          TEST_PREBUILT: 'true'
        run: |
          vp exec node --input-type=module <<'NODE_TEST'
          import { readFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';
          import { spawnSync } from 'node:child_process';
          const variables = parseEnv(readFileSync('.vercel/.env.production.local', 'utf8'));
          const publicVariables = Object.fromEntries(Object.entries(variables).filter(
            ([key]) => key.startsWith('VITE_') && process.env[key] === undefined
          ));
          const result = spawnSync('vp', ['run', 'test:e2e:production'], {
            env: { ...process.env, ...publicVariables }, stdio: 'inherit'
          });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE_TEST
          tar --compare -f "$RUNNER_TEMP/vercel-output.tar"
          find .vercel/output -printf '%y %m %P %l\n' | LC_ALL=C sort > "$RUNNER_TEMP/vercel-output-files-after.txt"
          cmp "$RUNNER_TEMP/vercel-output-files.txt" "$RUNNER_TEMP/vercel-output-files-after.txt"

      - name: Upload tested deployment artifact
        if: steps.deployment-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-output-${{ github.sha }}
          path: ${{ runner.temp }}/vercel-output.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  check:
    name: CI required
    needs: [quality, tooling, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all validation jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$E2E_RESULT" = success

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Verify deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID variable'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID variable'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret'; exit 1; }

      - name: Download tested deployment artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-output-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-artifact
          digest-mismatch: error

      - name: Restore tested deployment artifact
        run: |
          test ! -e .vercel/output
          tar -xpf "$RUNNER_TEMP/deployment-artifact/vercel-output.tar"

      - name: Deploy tested production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vp dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --yes
