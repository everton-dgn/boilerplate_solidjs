name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: '0'

jobs:
  check:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Read toolchain versions
        id: toolchain
        run: |
          vite_plus_version=$(jq -er '.devDependencies["vite-plus"]' package.json)
          node_version=$(jq -er '.devEngines.runtime.version' package.json)
          echo "vite-plus=$vite_plus_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: ${{ steps.toolchain.outputs.vite-plus }}
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check:ci

      - name: Check types
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:ci

      - name: Build application
        run: pnpm build

  deploy:
    needs: check
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      inputs.ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: |
          vite_plus_version=$(jq -er '.devDependencies["vite-plus"]' package.json)
          node_version=$(jq -er '.devEngines.runtime.version' package.json)
          echo "vite-plus=$vite_plus_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: ${{ steps.toolchain.outputs.vite-plus }}
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID variable'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID variable'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret'; exit 1; }

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run:
          pnpm dlx --allow-build esbuild vercel@latest pull --yes
          --environment=production

      - name: Build for production with Vite+
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx --allow-build esbuild vercel@latest build --prod --yes

      - name: Deploy production build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run:
          pnpm dlx --allow-build esbuild vercel@latest deploy --prebuilt --prod
          --yes
