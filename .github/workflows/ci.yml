name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: '0'

jobs:
  check:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Read toolchain versions
        id: toolchain
        run: |
          vite_plus_version=$(jq -er '.workspaces.catalog."vite-plus"' package.json)
          node_version=$(jq -er '.devEngines.runtime.version' package.json)
          bun_version=$(jq -er '.packageManager | capture("^bun@(?<version>[^+]+)").version' package.json)
          {
            echo "vite-plus=$vite_plus_version"
            echo "node=$node_version"
            echo "bun=$bun_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: ${{ steps.toolchain.outputs.vite-plus }}
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Restore validation cache
        id: validation-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite/task-cache
            node_modules/.vitest-cache
            .tsbuild
          key:
            ci-validation-v2-${{ runner.os }}-${{ runner.arch }}-node-${{
            steps.toolchain.outputs.node }}-bun-${{ steps.toolchain.outputs.bun
            }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-keys: |
            ci-validation-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node }}-bun-${{ steps.toolchain.outputs.bun }}-${{ hashFiles('bun.lock') }}-

      # Cria .tsbuild antes do lint também quando o cache está vazio, para
      # estabilizar a listagem da raiz que o Vite Task rastreia.
      - name: Check Node tooling types
        run: vp run typecheck:node

      - name: Check formatting and lint
        run: vp run check:ci

      - parallel:
          - name: Run tests with coverage
            run: vp run test:ci

          - name: Run tooling tests
            run: vp run test:tooling

      - name: Save validation cache
        if:
          ${{ !cancelled() && steps.validation-cache.outputs.cache-primary-key
          != '' }}
        background: true
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite/task-cache
            node_modules/.vitest-cache
            .tsbuild
          key: ${{ steps.validation-cache.outputs.cache-primary-key }}

      - name: Run end-to-end tests
        run: vp run test:e2e

      - name: Test production routes
        run: vp run test:e2e:production

      - name: Wait for cache upload
        wait-all:

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            .vitest/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  deploy:
    needs: check
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      inputs.ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: |
          vite_plus_version=$(jq -er '.workspaces.catalog."vite-plus"' package.json)
          node_version=$(jq -er '.devEngines.runtime.version' package.json)
          echo "vite-plus=$vite_plus_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: ${{ steps.toolchain.outputs.vite-plus }}
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: true
          cache-dependency-path: bun.lock
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID variable'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID variable'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret'; exit 1; }

      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vp dlx vercel@latest pull --yes --environment=production

      - name: Build for production with Vite+
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # O CLI consulta process.env antes de iniciar o build.
          ENABLE_EXPERIMENTAL_COREPACK: '0'
        run: vp dlx vercel@latest build --prod --yes

      - name: Deploy production build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vp dlx vercel@latest deploy --prebuilt --prod --yes
