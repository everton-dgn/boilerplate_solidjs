name: Set up project
description:
  Install the declared toolchain and, by default, frozen dependencies with
  package caching.

inputs:
  install-dependencies:
    description: Install dependencies and restore the package cache
    required: false
    default: 'true'
  cache-save:
    description: Save the package cache after the job succeeds
    required: false
    default: 'true'
  cache-toolchain:
    description: Restore Vite+, Node and Bun from the Actions cache
    required: false
    default: 'false'

outputs:
  node:
    description: Declared Node version
    value: ${{ steps.toolchain.outputs.node }}
  bun:
    description: Declared Bun version
    value: ${{ steps.toolchain.outputs.bun }}

runs:
  using: composite
  steps:
    - name: Read toolchain versions
      id: toolchain
      shell: bash
      run: |
        vite_plus_version=$(jq -er '.workspaces.catalog."vite-plus"' package.json)
        node_version=$(jq -er '.devEngines.runtime.version' package.json)
        bun_version=$(jq -er '.packageManager | capture("^bun@(?<version>[^+]+)").version' package.json)
        {
          echo "vite-plus=$vite_plus_version"
          echo "node=$node_version"
          echo "bun=$bun_version"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version: ${{ steps.toolchain.outputs.vite-plus }}
        node-version: ${{ steps.toolchain.outputs.node }}
        cache: ${{ inputs.install-dependencies == 'true' }}
        cache-save: ${{ inputs.cache-save }}
        cache-toolchain: ${{ inputs.cache-toolchain }}
        cache-dependency-path: bun.lock
        run-install: false

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: vp install --frozen-lockfile
