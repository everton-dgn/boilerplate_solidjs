name: Set up project
description:
  Install the declared toolchain and, by default, frozen dependencies with
  package caching.

inputs:
  install-dependencies:
    description: Install dependencies and restore the package cache
    required: false
    default: 'true'
  cache-save:
    description: Save the package and toolchain caches after the job succeeds
    required: false
    default: 'false'
  cache-toolchain:
    description: Restore Vite+, Node and Bun from the Actions cache
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Sem version e node-version, o setup-vp lê o vite-plus do catálogo do
    # package.json e o Node do devEngines.runtime.
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        cache: ${{ inputs.install-dependencies == 'true' }}
        cache-save: ${{ inputs.cache-save }}
        cache-toolchain: ${{ inputs.cache-toolchain }}
        cache-dependency-path: bun.lock
        run-install: false

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: vp install --frozen-lockfile
