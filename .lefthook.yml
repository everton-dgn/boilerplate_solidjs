colors: true

commit-msg:
  jobs:
    - name: commitlint
      run: vp run commitlint --edit {1}

pre-commit:
  skip:
    - merge
    - rebase
  jobs:
    - name: check
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,json,css,md,yml,yaml,toml,html}'
      run: vp run check:fix {staged_files}
      stage_fixed: true

    - name: secret-scan
      run: |
        if ! command -v kingfisher > /dev/null 2>&1; then
          echo "kingfisher não instalado; varredura de segredos ignorada."
          echo "Com Homebrew (macOS/Linux): brew install kingfisher"
          echo "Sem Homebrew (Linux/Windows): baixe o binário para seu sistema e adicione ao PATH: https://github.com/mongodb/kingfisher/releases"
          exit 0
        fi
        vp run scan:secrets --staged

pre-push:
  jobs:
    # Estes comandos restauram a mesma saída do Paraglide pelo cache do Vite
    # Task. Terminá-los antes dos testes evita restaurações concorrentes.
    - name: check-ci
      run: vp run check:ci

    - name: typecheck-node
      run: vp run typecheck:node

    - name: tests
      group:
        parallel: true
        jobs:
          - name: test
            run: vp run test:ci

          - name: tooling
            run: vp run test:tooling
