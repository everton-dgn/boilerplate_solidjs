colors: true

commit-msg:
  jobs:
    - name: commitlint
      run: vp run commitlint --edit {1}

pre-commit:
  skip:
    - merge
    - rebase
  jobs:
    - name: check
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs,json,css,md,yml,yaml,toml,html}'
      run: vp run check:fix {staged_files}
      stage_fixed: true

    - name: secret-scan
      run: |
        if ! command -v kingfisher > /dev/null 2>&1; then
          echo "kingfisher not installed; secret scan skipped."
          echo "With Homebrew (macOS/Linux): brew install kingfisher"
          echo "Without Homebrew (Linux/Windows): download the binary for your system and add it to the PATH: https://github.com/mongodb/kingfisher/releases"
          exit 0
        fi
        vp run scan:secrets --staged

pre-push:
  # Without piped, Lefthook keeps running the next jobs after a failure.
  piped: true
  jobs:
    # check:ci restores the Paraglide output from the Vite Task cache. Finishing it
    # before the tests avoids concurrent restores.
    - name: check-ci
      run: vp run check:ci

    - name: typecheck-node
      run: vp run typecheck:node

    # Vitest has short windows (per-test timeout and waitFor). Running it without
    # competing for the CPU with the tooling avoids timeouts without a logic
    # failure; the tooling and the release use 60 s timeouts and run in parallel
    # with Knip, the only one of the group that restores Paraglide.
    - name: test
      run: vp run test:ci

    - name: tooling-release-and-dead-code
      group:
        parallel: true
        jobs:
          - name: tooling
            run: vp run test:tooling

          - name: release
            run: vp run test:release

          - name: dead-code
            run: vp run dead-code
